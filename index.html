<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qureo AI Assistant</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 10px; font-size: 16px; box-sizing: border-box; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; width: 100%; }
        button:hover { background: #2563eb; }
        pre { background: #0f172a; padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid #334155; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🚀 مساعد Qureo الذكي (نسخة الموقع)</h2>
        <p>انسخ السؤال البرمجي أو محتوى الدرس من منصة Qureo والصقه هنا، والذكاء الاصطناعي هيحلّه لك فوراً مع حفظ ما تم حله محلياً!</p>
        
        <label>السؤال أو المشكلة البرمجية:</label><br><br>
        <textarea id="questionInput" placeholder="اكتب أو انسخ السؤال هنا..."></textarea>
        <button onclick="solveQuestion()">حل السؤال بالذكاء الاصطناعي</button>
    </div>

    <div class="card" id="resultCard" style="display:none;">
        <h3>💡 الحل والتحليل:</h3>
        <pre id="outputResult"></pre>
    </div>

    <script>
        const API_KEY = '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';

        async function solveQuestion() {
            const question = document.getElementById('questionInput').value.trim();
            if (!question) {
                alert('من فضلك اكتب السؤال أو الصقه أولاً!');
                return;
            }

            const output = document.getElementById('outputResult');
            const card = document.getElementById('resultCard');
            
            card.style.display = 'block';
            output.innerText = '⏳ جاري التحليل بواسطة الذكاء الاصطناعي...';

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o',
                        messages: [
                            { role: 'system', content: 'أنت خبير برمجة JavaScript ومساعد تعليمي لمنصة QUREO. قدم الحل الصحيح والكود البرمجي باللغة العربية بوضوح.' },
                            { role: 'user', content: question }
                        ],
                        temperature: 0.2
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices.length > 0) {
                    output.innerText = data.choices[0].message.content;
                } else {
                    output.innerText = '❌ حدث خطأ في استجابة الخادم.';
                }
            } catch (error) {
                output.innerText = '❌ خطأ في الاتصال بالشبكة: ' + error.message;
            }
        }
    </script>
</body>
</html>
