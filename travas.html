<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Rawaa ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{min-height:100vh;background:#0a0a0a;display:flex;justify-content:center;align-items:center;padding:16px;overflow:hidden}
body::before{content:'';position:fixed;width:600px;height:600px;background:radial-gradient(circle,#ff0f7b33,transparent);top:-150px;left:-150px;filter:blur(60px);pointer-events:none}
.card{position:relative;z-index:10;background:rgba(255,255,255,0.08);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,0.15);width:100%;max-width:420px;border-radius:28px;padding:24px;text-align:center}
h1{font-size:26px;font-weight:900;background:linear-gradient(90deg,#ff0f7b,#ffc857);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#fff;margin:14px 0;font-size:19px}.line{width:50px;height:3px;background:linear-gradient(90deg,#ff0f7b,#f89b29);margin:10px auto;border-radius:10px}
.btns{display:flex;gap:10px;margin:16px 0;position:relative;height:50px}
.btns button{flex:1;height:48px;border-radius:50px;border:none;font-weight:800;font-size:15px;cursor:pointer;transition:.2s}
#yesBtn{background:linear-gradient(135deg,#ff0f7b,#ff4d6d);color:#fff;box-shadow:0 8px 18px #ff0f7b55;flex:2}
#noBtn{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.2);position:relative}
.enter{width:100%;height:50px;border-radius:50px;border:none;background:#fff;color:#111;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px}
.counters{display:flex;gap:8px;margin:16px 0}.counter{flex:1;background:rgba(255,255,255,.06);border-radius:16px;padding:10px;border:1px solid rgba(255,255,255,.1)}
.counter b{font-size:22px;color:#ff6b9d;display:block}.counter span{font-size:10px;color:#fff9;line-height:1.3}
#step2,#step3{display:none}#loveText{color:#fffcc;line-height:1.8;margin:12px 0}
.pics{display:flex;gap:8px;margin-top:12px}.pics div{flex:1;height:230px;border-radius:18px;overflow:hidden;border:2px solid rgba(255,255,255,.15)}.pics img{width:100%;height:100%;object-fit:cover}
input{width:100%;height:48px;border-radius:50px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;text-align:center;outline:none;font-size:16px}
audio{width:100%;margin-top:10px;border-radius:20px}
.heart{position:fixed;bottom:-20px;z-index:1;animation:up 4s linear forwards;pointer-events:none}
@keyframes up{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-110vh) scale(1.5);opacity:0}}
</style>
</head>
<body>

<div class="card" id="step1">
  <h1>سؤال مهم</h1><div class="line"></div>
  <div class="sub">بتحبيني ولا لا؟</div>
  <div class="btns">
    <button id="yesBtn" onclick="go2()">أه طبعاً 😍</button>
    <button id="noBtn" onmouseover="escapeNo()" ontouchstart="escapeNo()" onclick="escapeNo()">لا 🙈</button>
  </div>
  <button class="enter" onclick="go2()">ادخلي هنا ✨</button>
</div>

<div class="card" id="step2">
  <h1>كلمة السر 🔐</h1><div class="line"></div>
  <input id="pass" placeholder="اكتبي كلمة السر">
  <button class="enter" onclick="check()">افتحي القلب 🔓</button>
  <p id="wrong" style="color:#ff6b9d;display:none;margin-top:8px">كلمة السر غلط يا قمر جربي تاني</p>
</div>

<div class="card" id="step3">
  <h1>كنت عارف ❤️</h1>
  <div class="counters">
    <div class="counter"><b id="d1">0</b><span>يوم مع بعض<br>من 13/10</span></div>
    <div class="counter"><b id="d2">0</b><span>يوم على عيد ميلادك<br>9/5 🎂</span></div>
  </div>
  <div class="line"></div>
  <p style="color:#ffc857;font-size:12px">🎵 رامي صبري - قولي الاقي انا زيك فين</p>
  <p id="loveText"></p>
  <audio id="song" controls loop><source src="song.mp3" type="audio/mpeg"></audio>
  <button class="enter" onclick="document.getElementById('song').play()" style="background:linear-gradient(135deg,#ff0f7b,#f89b29);color:#fff">▶️ شغلي أغنيتنا</button>
  <div class="pics"><div><img src="rawan1.jpg"></div><div><img src="rawan2.jpg"></div></div>
</div>

<script>
const LOVE="قولي قولي الاقي انا زيك فين<br>يا اللي مفيش في جمالك اتنين<br>هو احنا عشرة بس يومين<br>ده انا عايش ليك يا روان ❤️";
let noCount=0;
function escapeNo(){
  let btn=document.getElementById('noBtn');
  noCount++;
  if(noCount>2){btn.innerText="مفيش لا 😜"; }
  let x=Math.random()*200-100, y=Math.random()*100-50;
  btn.style.transform=`translate(${x}px, ${y}px)`;
}
function go2(){step1.style.display='none';step2.style.display='block';startHearts();}
function check(){
 if(pass.value.toLowerCase().trim()=='love'){
  step2.style.display='none';step3.style.display='block';type();counter();
  setTimeout(()=>{document.getElementById('song').play().catch(()=>{});},300);
  startHearts();
 }else wrong.style.display='block';
}
function counter(){let s=new Date("2026-10-13"),t=new Date();d1.innerText=Math.floor((t-s)/86400000);let now=new Date(),next=new Date(now.getFullYear(),4,9);if(next<now)next=new Date(now.getFullYear()+1,4,9);d2.innerText=Math.ceil((next-now)/86400000)}
function type(){let i=0;(function f(){if(i<=LOVE.length){loveText.innerHTML=LOVE.substring(0,i);i++;setTimeout(f,35)}})()}
function createHeart(){let h=document.createElement('div');h.className='heart';h.innerHTML=['❤️','💖','💕','✨','🌸'][Math.floor(Math.random()*5)];h.style.left=Math.random()*100+'vw';h.style.fontSize=(Math.random()*18+16)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),4000)}
function startHearts(){setInterval(createHeart,180)}
startHearts();
</script>
</body>
</html>
